[project]
name = "coinbase-assignment"
version = "0.1.0"
description = "Support-ticket triage classifier for a crypto/fintech product."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "joblib",
    "matplotlib>=3.11.1",
    "numpy",
    "pandas",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "scikit-learn",
    "scipy>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/models", "src/preprocessing", "src/feature_engineering", "src/statistical_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
